name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Apache Daffodil
        run: curl -sL https://archive.apache.org/dist/daffodil/3.7.0/bin/apache-daffodil-3.7.0-bin.tgz -o "$RUNNER_TEMP/daffodil.tgz" && tar -xzf "$RUNNER_TEMP/daffodil.tgz" -C "$RUNNER_TEMP" && echo "DAFFODIL=$RUNNER_TEMP/apache-daffodil-3.7.0-bin/bin/daffodil" >> "$GITHUB_ENV"

      - name: Compile Schemas
        run: find . -name '*.dfdl.xsd' | while read schema; do echo "compiling $schema"; "$DAFFODIL" save-parser -s "$schema" -r packet "$RUNNER_TEMP/parser.bin" || exit 1; done

      - name: Install Python Test Dependencies
        run: pip3 install dpkt

      - name: Clone Omi Data
        run: git clone --depth=1 https://github.com/Open-Markets-Initiative/omi-data-packets.git

      - name: Run B3 B3Derivatives BinaryUmdf Sbe v1.8 Definition Tests
        run: python3 .github/tests/test_b3derivatives_binaryumdf_v1_8.py

      - name: Run B3 B3Derivatives BinaryEntryPoint Sbe v8.0 Definition Tests
        run: python3 .github/tests/test_b3derivatives_binaryentrypoint_v8_0.py

      - name: Run B3 B3Derivatives BinaryEntryPoint Sbe v8.1 Definition Tests
        run: python3 .github/tests/test_b3derivatives_binaryentrypoint_v8_1.py

      - name: Run CixAts CixAspen MarketDataFeed Aspen v1.4 Definition Tests
        run: python3 .github/tests/test_cixats_cixaspen_marketdatafeed_v1_4.py

      - name: Run Cme Globex Mdp3 Sbe v1.5 Definition Tests
        run: python3 .github/tests/test_cme_globex_mdp3_v1_5.py

      - name: Run Cme Globex Mdp3 Sbe v1.8 Definition Tests
        run: python3 .github/tests/test_cme_globex_mdp3_v1_8.py

      - name: Run Cme Globex Mdp3 Sbe v1.9 Definition Tests
        run: python3 .github/tests/test_cme_globex_mdp3_v1_9.py

      - name: Run Cme Globex Mdp3 Sbe v1.12 Definition Tests
        run: python3 .github/tests/test_cme_globex_mdp3_v1_12.py

      - name: Run Cme Globex iLink3 Sbe v8.5 Definition Tests
        run: python3 .github/tests/test_cme_globex_ilink3_v8_5.py

      - name: Run Iex IexEquities Tops IexTp v1.56 Definition Tests
        run: python3 .github/tests/test_iexequities_tops_v1_56.py

      - name: Run Iex IexEquities Tops IexTp v1.64 Definition Tests
        run: python3 .github/tests/test_iexequities_tops_v1_64.py

      - name: Run Iex IexEquities Tops IexTp v1.66 Definition Tests
        run: python3 .github/tests/test_iexequities_tops_v1_66.py

      - name: Run Iex IexEquities Deep IexTp v1.06 Definition Tests
        run: python3 .github/tests/test_iexequities_deep_v1_06.py

      - name: Run Iex IexEquities Deep IexTp v1.08 Definition Tests
        run: python3 .github/tests/test_iexequities_deep_v1_08.py

      - name: Run Iex IexEquities DeepPlus IexTp v1.04 Definition Tests
        run: python3 .github/tests/test_iexequities_deepplus_v1_04.py


