name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Apache Daffodil
        run: curl -sL https://archive.apache.org/dist/daffodil/3.7.0/bin/apache-daffodil-3.7.0-bin.tgz -o "$RUNNER_TEMP/daffodil.tgz" && tar -xzf "$RUNNER_TEMP/daffodil.tgz" -C "$RUNNER_TEMP" && echo "DAFFODIL=$RUNNER_TEMP/apache-daffodil-3.7.0-bin/bin/daffodil" >> "$GITHUB_ENV"

      - name: Compile Schemas
        run: find . -name '*.dfdl.xsd' | while read schema; do echo "compiling $schema"; for root in $(grep -oE '^  <xs:element name="[^"]+"' "$schema" | sed -E 's/.*name="([^"]+)".*/\1/'); do echo "  root $root"; "$DAFFODIL" save-parser -s "$schema" -r "$root" "$RUNNER_TEMP/parser.bin" || exit 1; done; done

      - name: Install Python Test Dependencies
        run: pip3 install dpkt

      - name: Clone Omi Data
        run: git clone --depth=1 https://github.com/Open-Markets-Initiative/omi-data-packets.git

      - name: Run Asx AsxDerivatives Ntp Itch v1.05 Definition Tests
        run: python3 .github/tests/test_asxderivatives_ntp_v1_05.py

